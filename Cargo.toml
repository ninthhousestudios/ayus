[package]
name = "ayus"
version = "0.1.0"
edition = "2024"
description = "Ayurveda knowledge explorer — MVP demonstrating vidya's knowledge graph with cited dravyaguna data."
license = "AGPL-3.0"
publish = false

[[bin]]
name = "ayus"
path = "src/main.rs"

[[bin]]
name = "json2ttl"
path = "src/json2ttl.rs"

[[bin]]
name = "theory2ttl"
path = "src/theory2ttl.rs"

[dependencies]
# To track the active development branch explicitly:
vidya-core = { path = "../manas/vidya/vidya-core/" }
# vidya-core = { git = "https://github.com/ninthhousestudios/vidya", branch = "main" }
iced = { version = "0.14", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
open = "5"
image = "0.25.10"

[build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Āyus"
identifier = "studio.ninthhouse.ayus"
icon = [
    "assets/ayus-32x32.png",
    "assets/ayus-128x128.png",
    "assets/ayus-256x256.png",
    "assets/ayus-512x512.png",
    "assets/ayus-1024x1024.png",
]
category = "Education"
